<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS位置・速度トラッカー</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .status {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .data-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .data-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .data-value {
            font-size: 2em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .speed-display {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        
        .speed-value {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .coordinates {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .coord-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-family: monospace;
        }
        
        .history {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        @media (max-width: 600px) {
            .data-grid {
                grid-template-columns: 1fr;
            }
            
            .speed-value {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ GPS トラッカー</h1>
        
        <div class="status" id="status">
            GPS位置情報を取得中...
        </div>
        
        <div class="data-grid">
            <div class="speed-display">
                <div class="data-label">現在の速度</div>
                <div class="speed-value" id="speed">0</div>
                <div class="data-label">km/h</div>
            </div>
            
            <div class="data-card">
                <div class="data-label">精度</div>
                <div class="data-value" id="accuracy">-</div>
                <div class="data-label">m</div>
            </div>
            
            <div class="data-card">
                <div class="data-label">高度</div>
                <div class="data-value" id="altitude">-</div>
                <div class="data-label">m</div>
            </div>
        </div>
        
        <div class="coordinates">
            <h3>📍 現在位置</h3>
            <div class="coord-row">
                <span>緯度:</span>
                <span id="latitude">-</span>
            </div>
            <div class="coord-row">
                <span>経度:</span>
                <span id="longitude">-</span>
            </div>
            <div class="coord-row">
                <span>最終更新:</span>
                <span id="timestamp">-</span>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="button" onclick="startTracking()">📍 追跡開始</button>
            <button class="button" onclick="stopTracking()">⏹️ 追跡停止</button>
            <button class="button" onclick="clearHistory()">🗑️ 履歴クリア</button>
            <button class="button" onclick="toggleSettings()">⚙️ 設定</button>
        </div>
        
        <div id="settings" style="display: none; background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 15px; margin: 20px 0;">
            <h3>⚙️ GPS設定</h3>
            <div style="margin: 10px 0;">
                <label>精度閾値 (m): </label>
                <input type="range" id="accuracyThreshold" min="10" max="100" value="50" onchange="updateSettings()">
                <span id="accuracyValue">50</span>
            </div>
            <div style="margin: 10px 0;">
                <label>最小移動距離 (m): </label>
                <input type="range" id="minDistance" min="1" max="10" value="2" onchange="updateSettings()">
                <span id="minDistanceValue">2</span>
            </div>
            <div style="margin: 10px 0;">
                <label>平滑化強度: </label>
                <input type="range" id="smoothing" min="0.1" max="0.9" step="0.1" value="0.5" onchange="updateSettings()">
                <span id="smoothingValue">0.5</span>
            </div>
            <div style="margin: 10px 0;">
                <button class="button" onclick="recalibrateGPS()" style="width: 100%;">🔄 GPS再校正</button>
            </div>
        </div>
        
        <div class="history">
            <h3>📊 移動履歴</h3>
            <div id="history"></div>
        </div>
    </div>

    <script>
        let watchId = null;
        let previousPosition = null;
        let previousTime = null;
        let isTracking = false;
        let history = [];
        let speedHistory = [];
        let smoothedSpeed = 0;
        let positionBuffer = [];
        let lastValidPosition = null;

        // 位置情報の取得オプション
        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 2000
        };

        // フィルタリング設定（動的に変更可能）
        let ACCURACY_THRESHOLD = 50; // 精度50m以下のみ使用
        let MIN_DISTANCE = 2; // 最小移動距離2m
        const MAX_SPEED = 500; // 最大速度500km/h（異常値除去）
        let SMOOTHING_FACTOR = 0.5; // 速度平滑化係数
        
        // 高度なフィルタリング用変数
        let kalmanFilter = {
            lat: null,
            lon: null,
            speed: 0,
            uncertainty: 1000
        };
        let consecutiveGoodReadings = 0;
        let lastGoodTime = null;
        let stationaryCount = 0;

        // 2点間の距離を計算（ハーバーサイン公式）
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球の半径（km）
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 速度を計算
        function calculateSpeed(currentPos, currentTime) {
            if (!previousPosition || !previousTime) {
                return 0;
            }

            const distance = calculateDistance(
                previousPosition.latitude,
                previousPosition.longitude,
                currentPos.latitude,
                currentPos.longitude
            );

            const timeDiff = (currentTime - previousTime) / 1000; // 秒
            const speed = (distance / timeDiff) * 3600; // km/h

            return Math.max(0, speed); // 負の値を避ける
        }

        // カルマンフィルタ風の位置推定
        function kalmanUpdate(lat, lon, accuracy) {
            if (kalmanFilter.lat === null) {
                kalmanFilter.lat = lat;
                kalmanFilter.lon = lon;
                kalmanFilter.uncertainty = accuracy;
                return { lat, lon };
            }
            
            // カルマンゲインの計算
            const kalmanGain = kalmanFilter.uncertainty / (kalmanFilter.uncertainty + accuracy);
            
            // 位置の更新
            const newLat = kalmanFilter.lat + kalmanGain * (lat - kalmanFilter.lat);
            const newLon = kalmanFilter.lon + kalmanGain * (lon - kalmanFilter.lon);
            
            // 不確実性の更新
            kalmanFilter.uncertainty = (1 - kalmanGain) * kalmanFilter.uncertainty;
            
            kalmanFilter.lat = newLat;
            kalmanFilter.lon = newLon;
            
            return { lat: newLat, lon: newLon };
        }

        // 位置情報の品質チェック（大幅に緩和）
        function isPositionValid(position) {
            const coords = position.coords;
            
            // 基本的な精度チェック（より寛容に）
            if (coords.accuracy > ACCURACY_THRESHOLD * 2) { // 閾値の2倍まで許可
                return false;
            }
            
            // 座標の妥当性チェック
            if (Math.abs(coords.latitude) > 90 || Math.abs(coords.longitude) > 180) {
                return false;
            }
            
            // 異常な跳躍チェックを緩和
            if (lastValidPosition) {
                const distance = calculateDistance(
                    lastValidPosition.latitude,
                    lastValidPosition.longitude,
                    coords.latitude,
                    coords.longitude
                ) * 1000; // メートル単位
                
                const timeDiff = (Date.now() - (lastGoodTime || Date.now())) / 1000;
                const maxPossibleDistance = 150 * timeDiff; // 150m/s = 540km/h（より寛容に）
                
                if (distance > maxPossibleDistance && timeDiff > 2) { // 2秒以上の場合のみチェック
                    return false;
                }
            }
            
            return true;
        }

        // 停止状態の検出
        function isStationary(coords) {
            if (!lastValidPosition) return false;
            
            const distance = calculateDistance(
                lastValidPosition.latitude,
                lastValidPosition.longitude,
                coords.latitude,
                coords.longitude
            ) * 1000; // メートル単位
            
            return distance < MIN_DISTANCE;
        }

        // 高度な速度フィルタリング
        function smoothSpeed(newSpeed) {
            // 異常値の事前チェック
            if (newSpeed > MAX_SPEED || newSpeed < 0) {
                newSpeed = smoothedSpeed; // 前回の値を使用
            }
            
            speedHistory.push(newSpeed);
            if (speedHistory.length > 8) { // より多くのサンプルを保持
                speedHistory.shift();
            }
            
            // 中央値フィルタで外れ値を除去
            const sortedSpeeds = [...speedHistory].sort((a, b) => a - b);
            const median = sortedSpeeds[Math.floor(sortedSpeeds.length / 2)];
            
            // 標準偏差による異常値検出
            const mean = speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length;
            const variance = speedHistory.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / speedHistory.length;
            const stdDev = Math.sqrt(variance);
            
            // 異常値を除去した配列
            const filteredSpeeds = speedHistory.filter(s => 
                Math.abs(s - mean) <= 2 * stdDev && s <= MAX_SPEED
            );
            
            if (filteredSpeeds.length === 0) {
                return smoothedSpeed;
            }
            
            // 重み付き移動平均（新しい値により大きな重みを付与）
            let weightedSum = 0;
            let totalWeight = 0;
            
            filteredSpeeds.forEach((speed, index) => {
                const weight = Math.pow(1.2, index); // 新しい値ほど重い
                weightedSum += speed * weight;
                totalWeight += weight;
            });
            
            const weightedAverage = weightedSum / totalWeight;
            
            // 適応的平滑化（変化が小さい時はより強く平滑化）
            const changeMagnitude = Math.abs(newSpeed - smoothedSpeed);
            const adaptiveFactor = Math.min(SMOOTHING_FACTOR * (1 + changeMagnitude / 10), 0.9);
            
            smoothedSpeed = smoothedSpeed * (1 - adaptiveFactor) + weightedAverage * adaptiveFactor;
            
            return Math.max(0, smoothedSpeed);
        }

        // 位置情報の更新処理（大幅改良版）
        function updatePosition(position) {
            const currentTime = Date.now();
            const coords = position.coords;
            
            // 位置情報の品質チェック（非常に寛容に）
            const isValid = isPositionValid(position);
            
            if (!isValid) {
                consecutiveGoodReadings = 0;
                // 精度が悪くても表示は続ける
                document.getElementById('status').textContent = `⚠️ GPS精度不良 (${coords.accuracy.toFixed(0)}m) - 継続中`;
                document.getElementById('status').style.background = 'rgba(255, 165, 0, 0.3)';
                
                // 精度が悪くても位置とデータを更新
                updateUI(coords, smoothedSpeed || 0, currentTime, true);
                
                // バッファにも追加（フィルタリングで使用）
                positionBuffer.push({
                    coords: coords,
                    time: currentTime,
                    accuracy: coords.accuracy,
                    lowQuality: true
                });
                
                if (positionBuffer.length > 5) {
                    positionBuffer.shift();
                }
                return;
            }
            
            consecutiveGoodReadings++;
            lastGoodTime = currentTime;
            
            // カルマンフィルタで位置を平滑化
            const filteredPos = kalmanUpdate(coords.latitude, coords.longitude, coords.accuracy);
            
            // フィルタ済み座標で新しいcoords オブジェクトを作成
            const smoothedCoords = {
                ...coords,
                latitude: filteredPos.lat,
                longitude: filteredPos.lon
            };
            
            // 停止状態の検出（条件を緩和）
            if (isStationary(smoothedCoords)) {
                stationaryCount++;
                if (stationaryCount > 5) { // より多くの確認が必要
                    // 停止状態が続いている
                    const filteredSpeed = smoothSpeed(0);
                    updateUI(smoothedCoords, filteredSpeed, currentTime);
                    return;
                }
            } else {
                stationaryCount = 0;
            }
            
            // 位置バッファに追加
            positionBuffer.push({
                coords: smoothedCoords,
                time: currentTime,
                accuracy: coords.accuracy
            });
            
            // バッファサイズ制限（より多くのデータを保持）
            if (positionBuffer.length > 5) {
                positionBuffer.shift();
            }
            
            // 最初のデータでもすぐに表示開始
            if (positionBuffer.length === 1) {
                document.getElementById('status').textContent = '� GPS信号取得開始'.;
                document.getElementById('status').style.background = 'rgba(0, 150, 255, 0.3)';
                updateUI(smoothedCoords, 0, currentTime);
                return;
            }
            
            // 複数点での速度計算（より安定した結果を得る）
            let totalSpeed = 0;
            let validCalculations = 0;
            
            for (let i = 1; i < positionBuffer.length; i++) {
                const current = positionBuffer[i];
                const previous = positionBuffer[i - 1];
                
                const distance = calculateDistance(
                    previous.coords.latitude,
                    previous.coords.longitude,
                    current.coords.latitude,
                    current.coords.longitude
                );
                
                const timeDiff = (current.time - previous.time) / 1000;
                
                if (timeDiff > 0.3) { // 時間間隔を短縮
                    const speed = (distance / timeDiff) * 3600;
                    if (speed <= MAX_SPEED && speed >= 0) {
                        totalSpeed += speed;
                        validCalculations++;
                    }
                }
            }
            
            let rawSpeed = 0;
            if (validCalculations > 0) {
                rawSpeed = totalSpeed / validCalculations;
            } else if (positionBuffer.length >= 2) {
                // 有効な計算がない場合でも、最新の2点で計算を試行
                const current = positionBuffer[positionBuffer.length - 1];
                const previous = positionBuffer[positionBuffer.length - 2];
                
                const distance = calculateDistance(
                    previous.coords.latitude,
                    previous.coords.longitude,
                    current.coords.latitude,
                    current.coords.longitude
                );
                
                const timeDiff = (current.time - previous.time) / 1000;
                if (timeDiff > 0) {
                    rawSpeed = Math.max(0, (distance / timeDiff) * 3600);
                }
            }
            
            // 速度フィルタリング
            const filteredSpeed = smoothSpeed(Math.max(0, rawSpeed));
            
            updateUI(smoothedCoords, filteredSpeed, currentTime);
            
            // 有効な位置として保存
            lastValidPosition = smoothedCoords;
        }

        // UI更新関数
        function updateUI(coords, speed, currentTime, isLowQuality = false) {
            document.getElementById('latitude').textContent = coords.latitude.toFixed(6);
            document.getElementById('longitude').textContent = coords.longitude.toFixed(6);
            document.getElementById('speed').textContent = speed.toFixed(1);
            document.getElementById('accuracy').textContent = coords.accuracy.toFixed(0);
            document.getElementById('altitude').textContent = coords.altitude ? coords.altitude.toFixed(0) : '-';
            document.getElementById('timestamp').textContent = new Date().toLocaleTimeString('ja-JP');
            
            // ステータス更新
            if (isLowQuality) {
                // 低品質データの場合はそのまま
            } else if (coords.accuracy <= 5) {
                document.getElementById('status').textContent = '🎯 GPS信号最高品質';
                document.getElementById('status').style.background = 'rgba(0, 255, 0, 0.4)';
            } else if (coords.accuracy <= 15) {
                document.getElementById('status').textContent = '✅ GPS信号良好';
                document.getElementById('status').style.background = 'rgba(0, 255, 0, 0.3)';
            } else if (coords.accuracy <= 30) {
                document.getElementById('status').textContent = '📶 GPS信号普通';
                document.getElementById('status').style.background = 'rgba(255, 255, 0, 0.3)';
            } else {
                document.getElementById('status').textContent = '📶 GPS信号弱い';
                document.getElementById('status').style.background = 'rgba(255, 165, 0, 0.3)';
            }

            // 履歴に追加（有意な変化がある場合のみ）
            if (speed > 1 || history.length === 0 || (currentTime - (history[0]?.timestamp || 0)) > 10000) {
                const historyItem = {
                    time: new Date().toLocaleTimeString('ja-JP'),
                    speed: speed.toFixed(1),
                    lat: coords.latitude.toFixed(6),
                    lon: coords.longitude.toFixed(6),
                    accuracy: coords.accuracy.toFixed(0),
                    timestamp: currentTime
                };
                
                history.unshift(historyItem);
                if (history.length > 15) {
                    history.pop();
                }
                
                updateHistoryDisplay();
            }
        }

        // エラー処理
        function handleError(error) {
            let message = '';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = '❌ 位置情報の使用が拒否されました';
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = '❌ 位置情報が利用できません';
                    break;
                case error.TIMEOUT:
                    message = '⏰ 位置情報の取得がタイムアウトしました';
                    break;
                default:
                    message = '❌ 不明なエラーが発生しました';
                    break;
            }
            
            document.getElementById('status').textContent = message;
            document.getElementById('status').style.background = 'rgba(255, 0, 0, 0.3)';
        }

        // 履歴表示の更新
        function updateHistoryDisplay() {
            const historyDiv = document.getElementById('history');
            historyDiv.innerHTML = '';
            
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `${item.time} - ${item.speed} km/h (精度:${item.accuracy}m)`;
                historyDiv.appendChild(div);
            });
        }

        // 追跡開始
        function startTracking() {
            if (!navigator.geolocation) {
                alert('このブラウザは位置情報をサポートしていません');
                return;
            }

            if (isTracking) {
                return;
            }

            isTracking = true;
            document.getElementById('status').textContent = '🔍 GPS信号を検索中...';
            document.getElementById('status').style.background = 'rgba(255, 255, 0, 0.3)';

            watchId = navigator.geolocation.watchPosition(
                updatePosition,
                handleError,
                options
            );
        }

        // 追跡停止
        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            isTracking = false;
            document.getElementById('status').textContent = '⏹️ 追跡を停止しました';
            document.getElementById('status').style.background = 'rgba(128, 128, 128, 0.3)';
        }

        // 履歴クリア
        function clearHistory() {
            history = [];
            speedHistory = [];
            positionBuffer = [];
            smoothedSpeed = 0;
            lastValidPosition = null;
            consecutiveGoodReadings = 0;
            lastGoodTime = null;
            stationaryCount = 0;
            kalmanFilter = {
                lat: null,
                lon: null,
                speed: 0,
                uncertainty: 1000
            };
            updateHistoryDisplay();
            previousPosition = null;
            previousTime = null;
        }

        // ページ読み込み時に自動開始
        window.addEventListener('load', function() {
            startTracking();
        });

        // 設定パネルの表示切替
        function toggleSettings() {
            const settings = document.getElementById('settings');
            settings.style.display = settings.style.display === 'none' ? 'block' : 'none';
        }

        // GPS再校正
        function recalibrateGPS() {
            clearHistory();
            if (isTracking) {
                stopTracking();
                setTimeout(() => {
                    startTracking();
                }, 1000);
            }
            document.getElementById('status').textContent = '🔄 GPS再校正中...';
            document.getElementById('status').style.background = 'rgba(0, 150, 255, 0.3)';
        }

        // 設定値の更新
        function updateSettings() {
            const accuracyThreshold = document.getElementById('accuracyThreshold').value;
            const minDistance = document.getElementById('minDistance').value;
            const smoothing = document.getElementById('smoothing').value;
            
            document.getElementById('accuracyValue').textContent = accuracyThreshold;
            document.getElementById('minDistanceValue').textContent = minDistance;
            document.getElementById('smoothingValue').textContent = smoothing;
            
            // グローバル変数を更新
            ACCURACY_THRESHOLD = parseInt(accuracyThreshold);
            MIN_DISTANCE = parseInt(minDistance);
            SMOOTHING_FACTOR = parseFloat(smoothing);
            
            // 設定変更時にフィルタをリセット
            speedHistory = [];
            smoothedSpeed = 0;
        }

        // ページを離れる時に追跡停止
        window.addEventListener('beforeunload', function() {
            stopTracking();
        });
    </script>
</body>
</html>
